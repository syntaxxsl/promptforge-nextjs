name: PromptForge V2 studio branch quality

on:
  push:
    branches:
      - promptforge-v2-studio-workspaces
    paths:
      - "v2/**"
      - ".github/workflows/promptforge-studio-branch-ci.yml"
  workflow_dispatch:
  pull_request:
    branches:
      - promptforge-v2-studio-workspaces
    paths:
      - "v2/**"
      - ".github/workflows/promptforge-studio-branch-ci.yml"

permissions:
  contents: read

concurrency:
  group: promptforge-studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tests, types and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Reconcile lockfile with the V2 manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build
