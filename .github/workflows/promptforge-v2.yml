name: PromptForge V2 checks

on:
  push:
    branches:
      - promptforge-v2-development
      - promptforge-v2-next16-upgrade
    paths:
      - "v2/**"
      - ".github/workflows/promptforge-v2.yml"
  pull_request:
    branches:
      - promptforge-v2-development
      - promptforge-v2-next16-upgrade
    paths:
      - "v2/**"
      - ".github/workflows/promptforge-v2.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Generate lockfile for isolated dependency upgrade
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Migrate async Supabase cookie calls
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const root = process.cwd();
          const changed = [];

          function visit(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === '.next') continue;
              const file = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                visit(file);
                continue;
              }
              if (!/\\.tsx?$/.test(entry.name) || file.endsWith(path.join('lib', 'supabase', 'server.ts'))) continue;

              const source = fs.readFileSync(file, 'utf8');
              const migrated = source.replace(
                /(?<!function )(?<!await )createSupabaseServerClient\\(\\)/g,
                'await createSupabaseServerClient()'
              );
              if (migrated !== source) {
                fs.writeFileSync(file, migrated);
                changed.push(path.relative(root, file));
              }
            }
          }

          visit(root);
          console.log(changed.length ? changed.join('\\n') : 'No remaining synchronous Supabase client calls.');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: promptforge-v2-next16-lockfile
          path: v2/package-lock.json
          retention-days: 7
      - name: Dependency vulnerability report
        run: |
          npm audit --json > /tmp/npm-audit-all.json || true
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          node <<'NODE'
          const fs = require('node:fs');

          function readReport(path) {
            try {
              return JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch {
              return {};
            }
          }

          function formatReport(label, report) {
            const counts = report.metadata?.vulnerabilities ?? {};
            const lines = [
              `### ${label}`,
              '',
              `Total: **${counts.total ?? 0}** · Critical: **${counts.critical ?? 0}** · High: **${counts.high ?? 0}** · Moderate: **${counts.moderate ?? 0}** · Low: **${counts.low ?? 0}**`,
              ''
            ];

            const entries = Object.entries(report.vulnerabilities ?? {});
            if (!entries.length) {
              lines.push('No vulnerable packages reported.');
              return lines.join('\n');
            }

            lines.push('| Package | Severity | Direct | Affected range | Fix available |');
            lines.push('|---|---|---:|---|---|');
            for (const [name, item] of entries) {
              lines.push(`| ${name} | ${item.severity ?? 'unknown'} | ${item.isDirect ? 'yes' : 'no'} | ${item.range ?? '—'} | ${typeof item.fixAvailable === 'object' ? JSON.stringify(item.fixAvailable) : String(item.fixAvailable ?? 'unknown')} |`);
            }
            return lines.join('\n');
          }

          const all = readReport('/tmp/npm-audit-all.json');
          const production = readReport('/tmp/npm-audit-production.json');
          const summary = [
            '# PromptForge V2 dependency audit',
            '',
            formatReport('All dependencies (production + development)', all),
            '',
            formatReport('Production dependencies only', production),
            ''
          ].join('\n');

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          NODE
      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptforge-v2-npm-audit
          path: |
            /tmp/npm-audit-all.json
            /tmp/npm-audit-production.json
          if-no-files-found: warn
          retention-days: 7
      - name: Run tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit verified Next.js 16 migration
        if: success() && github.ref == 'refs/heads/promptforge-v2-next16-upgrade'
        run: |
          git add -u v2
          git add v2/proxy.ts v2/package-lock.json
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: complete Next.js 16 async request API migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
